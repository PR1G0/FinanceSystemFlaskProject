<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            color: white;
        }

        .brand {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #ddd;
            margin-bottom: 20px;
        }

        .container h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            outline: none;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .input-group select {
            appearance: none;
        }

        .input-group input::placeholder {
            color: #ddd;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #ffffff;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ddd;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .footer a {
            color: #fff;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand">💼 Business Suite</div>
        <div class="subtitle">Finance & Business Management System</div>

        <h2>Welcome Back</h2>
        <p style="text-align:center; font-size:14px; color:#eee; margin-bottom:20px;">
            Login to continue
        </p>

        <form method="POST">

            <div class="input-group">
                <select name="type" required>
                    <option value="" disabled selected>Select User Type</option>
                    <option value="admin">Admin</option>
                    <option value="viewer">Viewer</option>
                    <option value="analyst">Analyst</option>
                </select>
            </div>

            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" value="Login" class="btn">Login</button>
        </form>

        <div class="footer">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

</body>
</html>
